# Country-specific nginx locations (owned by this repo, never touched by copier update).
# Included inside the server block of default.conf, before the generic locations.

# Results page: a self-contained R Markdown / Plotly export in the gripenetpt-results bucket,
# shown in an iframe on /results (pages.json "iframeEmbed").
# It gets nosniff but NOT the app CSP (no security-headers.conf include): the export runs
# inline scripts and loads Mapbox / Carto / Stamen tiles and telemetry, and never had a CSP.
location /results-proxy/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    proxy_pass https://storage.googleapis.com/gripenetpt-results/;
    proxy_ssl_server_name on;
    proxy_set_header Host storage.googleapis.com;
}
