# Country Content-Security-Policy directives (owned by this repo, never touched by copier update).
# One directive per line. Only the policy lives here: security-headers.conf (template) sends
# the header and appends upgrade-insecure-requests for https clients.
# Not applied to /results-proxy/ (see locations.conf).
#
# Third parties and why they are here:
#   recaptcha  www.google.com/recaptcha, www.gstatic.com/recaptcha, recaptcha.google.com (signup/login)
#   results    /results-proxy/results.html is same origin: frame-src 'self'
#
# Replaces the <meta> CSP built from REACT_APP_CSP_* (CRA). Dropped from that policy:
# 'unsafe-inline' / 'unsafe-eval' scripts (the app has no inline scripts and doesn't eval),
# recaptcha.net, gripenet.pt, *.gripenet.pt and hivlab.github.io (nothing in the app or its
# content loads from them; hivlab.github.io was the old results host), and
# storage.googleapis.com (results are fetched through the same-origin /results-proxy/).

set $csp "default-src 'self'";
set $csp "${csp}; base-uri 'self'";
set $csp "${csp}; object-src 'none'";
set $csp "${csp}; frame-ancestors 'none'";
set $csp "${csp}; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/";
set $csp "${csp}; style-src 'self' 'unsafe-inline' https://www.gstatic.com/recaptcha/ https://www.google.com/recaptcha/";
set $csp "${csp}; img-src 'self' data: https:";
set $csp "${csp}; font-src 'self' data:";
set $csp "${csp}; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/";
set $csp "${csp}; connect-src 'self' https://www.google.com/recaptcha/";
